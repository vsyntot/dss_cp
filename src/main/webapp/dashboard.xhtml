<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">

<ui:composition template="template.xhtml">
    <ui:define name="content">
        <h:form>
            <div class="form-card">

                <div class="form-item">
                    <h:panelGroup rendered="#{candidateSessionBean.user.roleName eq 'admin'}">
                        <h3>Админ-панель</h3>
                        <div class="link-group center">
                            <h:link value="Добавить нового кандидата" outcome="input.xhtml" />
                            <span>|</span>
                            <h:link value="Список кандидатов" outcome="result.xhtml" />
                        </div>
                    </h:panelGroup>

                    <h:panelGroup rendered="#{candidateSessionBean.user.roleName eq 'user'}">
                        <h3>Панель пользователя</h3>
                        <div class="link-group center">
                            <p>Вы можете только просматривать список кандидатов.</p>
                            <h:link value="Перейти к списку" outcome="result.xhtml" />
                        </div>
                    </h:panelGroup>
                </div>

            </div>
        </h:form>
    </ui:define>
</ui:composition>
</html>
