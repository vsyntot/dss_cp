<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>Вход в систему</title>
    <h:outputStylesheet library="css" name="style.css"/>
</h:head>

<h:body>
    <div class="form-card">
        <h2>Вход в систему</h2>

        <h:form id="loginForm" styleClass="form-grid">

            <p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" />

            <div class="form-item">
                <p:outputLabel for="username" value="Имя пользователя:" />
                <p:inputText id="username" value="#{loginBean.username}" required="true" label="Имя пользователя" style="width:100%" />
            </div>

            <div class="form-item">
                <p:outputLabel for="password" value="Пароль:" />
                <p:password id="password" value="#{loginBean.password}" required="true" label="Пароль" style="width:100%" />
            </div>

            <p:commandButton value="Войти"
                             action="#{loginBean.login}"
                             update="loginForm messages"
                             styleClass="button"
                             icon="pi pi-sign-in" />
        </h:form>

    </div>
</h:body>
</html>
